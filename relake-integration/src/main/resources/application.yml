spring:
  datasource:
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/relake_metadata?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Shanghai&characterEncoding=UTF-8
    username: ${MYSQL_USER:relake}
    password: ${MYSQL_PWD:relake123}
    driver-class-name: com.mysql.cj.jdbc.Driver

  cloud:
    openfeign:
      lazy-attributes-resolution: true
      client:
        config:
          relake-metadata:
            connect-timeout: 5000
            read-timeout: 10000

mybatis-plus:
  global-config:
    db-config:
      id-type: assign_id
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
